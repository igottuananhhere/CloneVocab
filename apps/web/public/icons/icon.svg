<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13182e" />
      <stop offset="50%" stop-color="#1c2340" />
      <stop offset="100%" stop-color="#252c48" />
    </linearGradient>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#384166" stroke-width="4" stroke-opacity="0.6" />

  <g transform="translate(256, 256)">
    <!-- Back Flashcard (Rotated -12 deg) -->
    <g transform="rotate(-12)" filter="url(#shadow)">
      <rect x="-130" y="-170" width="260" height="340" rx="28" fill="url(#cardBack)" stroke="#818cf8" stroke-width="3" stroke-opacity="0.5" />
      <line x1="-80" y1="-80" x2="40" y2="-80" stroke="#c7d2fe" stroke-width="12" stroke-linecap="round" stroke-opacity="0.4" />
      <line x1="-80" y1="-40" x2="80" y2="-40" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round" stroke-opacity="0.3" />
      <line x1="-80" y1="-10" x2="20" y2="-10" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round" stroke-opacity="0.3" />
    </g>

    <!-- Front Flashcard (Rotated 6 deg) -->
    <g transform="rotate(6)" filter="url(#shadow)">
      <rect x="-130" y="-170" width="260" height="340" rx="28" fill="url(#cardFront)" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.7" />
      
      <!-- Card content lines -->
      <line x1="-80" y1="-90" x2="30" y2="-90" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.9" />
      <line x1="-80" y1="-45" x2="60" y2="-45" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round" stroke-opacity="0.7" />
      
      <!-- Central Vocabulary Symbol "V" -->
      <path d="M-50,20 L0,110 L50,20" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Glowing Star / Sparkle in Top Right of Card -->
      <circle cx="75" cy="-115" r="14" fill="#fbbf24" />
      <polygon points="75,-140 79,-121 98,-115 79,-109 75,-90 71,-109 52,-115 71,-121" fill="#fef08a" />
    </g>

    <!-- Glowing Streak Flame Badge in Bottom Right -->
    <g transform="translate(85, 95)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="42" fill="#13182e" stroke="#f59e0b" stroke-width="4" />
      <path d="M-6,18 C-16,14 -22,0 -12,-16 C-10,-10 -6,-6 -2,-10 C-2,-20 8,-28 10,-32 C16,-22 24,-4 18,14 C14,24 0,26 -6,18 Z" fill="url(#accentGrad)" />
      <path d="M-2,16 C-7,13 -10,6 -5,-2 C-4,1 -2,3 0,1 C0,-4 5,-8 6,-10 C9,-5 13,4 10,13 C8,18 1,19 -2,16 Z" fill="#fef08a" />
    </g>
  </g>
</svg>

